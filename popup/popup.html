<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>RedirectShield</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="../assets/icons/icon48.png" alt="Shield" width="32" height="32">
      <h2>RedirectShield</h2>
    </div>

    <div class="status-card">
      <div class="status-label">Protection Status</div>
      <div class="status-value" id="protectionStatus">Active</div>
    </div>

    <div class="stats">
      <div>🚫 Blocked Redirects: <span id="blockCount">0</span></div>
      <div>⚠️ Suspicious: <span id="suspiciousCount">0</span></div>
    </div>

    <div class="controls">
      <label>
        <input type="checkbox" id="enableToggle" checked> Enable Protection
      </label>
      <label>
        <input type="checkbox" id="strictToggle"> Strict Mode
      </label>
    </div>

    <div class="recent-log">
      <h4>Recent Activity</h4>
      <ul id="activityList">
        <li>No events yet</li>
      </ul>
    </div>

    <button id="openDashboard">Open Dashboard</button>
  </div>
  <script src="popup.js" type="module"></script>
</body>
</html>
